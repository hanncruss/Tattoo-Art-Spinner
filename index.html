<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daddy Jacks Tattoos</title>

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <main class="app">

    <img
      src="artwork/daddy-jacks-logo.jpg"
      alt="Daddy Jacks Tattoos"
      class="logo"
    >

    <div class="spinner-panel">
      <p class="spinner-instruction">
        SPIN • REVEAL • GET WHAT YOU GET
      </p>

      <div class="spinner-window">
        <div class="pointer"></div>
        <div id="spinnerTrack" class="spinner-track"></div>
      </div>
    </div>

    <button id="spinButton">Spin</button>

    <p id="spinCount">Spins left: 3</p>

    <section id="result" class="result hidden">
      <h2>Your Tattoo Is...</h2>

      <div id="selectedGallery" class="selected-gallery"></div>
    </section>

  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
